name: agent

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      plan:
        default: plan.md

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: agent-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      branch: ${{ steps.meta.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install aider-chat requests pytest
      - id: meta
        run: |
          echo "branch=agent/${{ github.event.issue.number || github.run_id }}" >> $GITHUB_OUTPUT
          echo "plan=${{ github.event.inputs.plan || 'plan.md' }}" >> $GITHUB_OUTPUT
      - run: git checkout -b "${{ steps.meta.outputs.branch }}"
      - name: guard
        run: |
          BR="${{ steps.meta.outputs.branch }}"
          if [ "$BR" = "main" ] || [ "$BR" = "master" ]; then
            echo "::error::агент пытается пушить в $BR"; exit 1
          fi
      - env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_BASE: https://api.deepseek.com/v1
          PLAN: ${{ steps.meta.outputs.plan }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python .agent/orchestrator.py
      - run: git push -u origin "${{ steps.meta.outputs.branch }}" --force

  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests pytest
      - id: v
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PLAN: plan.md
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .agent/verify.py
        continue-on-error: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BR="${{ needs.build.outputs.branch }}"
          if [ "${{ steps.v.outcome }}" = "success" ]; then
            gh pr create --base main --head "$BR" \
              --title "agent: $BR" --body-file verdict.md || \
            gh pr comment "$BR" --body-file verdict.md
          else
            gh pr create --base main --head "$BR" --draft \
              --title "agent (draft): $BR" --body-file verdict.md || \
            gh pr comment "$BR" --body-file verdict.md
            exit 1
          fi
